<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe9b8">
<title>이번 주에 시간 돼?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
:root{--cream:#fff3d6;--ink:#2b1d16;--red:#ef4a2b;--sun:#ffc94a;--mint:#3ecf9b;--card:#fffdf7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overscroll-behavior:none}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
background:var(--cream) radial-gradient(#f3d58f 1.4px,transparent 1.5px) 0 0/20px 20px;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-weight:500;overflow-x:hidden;touch-action:manipulation}
h1,h2,button,.chip,.jua{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400}
.float{position:fixed;font-size:30px;opacity:.55;pointer-events:none;animation:fl 9s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-18px) rotate(10deg)}}
header{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;display:flex;gap:6px;z-index:30}
header button{font-size:13px;padding:6px 12px;border-radius:99px;border:2px solid var(--ink);background:#fff;cursor:pointer;color:var(--ink)}
main{width:100%;max-width:440px;position:relative;z-index:5}
.card{background:var(--card);border:3px solid var(--ink);border-radius:28px;box-shadow:7px 7px 0 var(--ink);padding:28px 22px 26px;text-align:center;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.hidden{display:none!important}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.95)}}
h1{font-size:clamp(25px,7.2vw,32px);line-height:1.25;margin:6px 0 20px}
h2{font-size:clamp(24px,6.6vw,30px);line-height:1.25;margin:4px 0 6px}
.sub{font-size:14px;color:#7a6455;margin:0 0 18px}
.pug{position:relative;width:132px;height:132px;margin:0 auto 14px}
.pug img{width:100%;height:100%;object-fit:cover;border-radius:36px;border:3px solid var(--ink);transform:rotate(-4deg);box-shadow:4px 4px 0 var(--sun)}
.pug.wob img{animation:wob .45s}
@keyframes wob{25%{transform:rotate(9deg) scale(1.05)}50%{transform:rotate(-12deg)}75%{transform:rotate(6deg)}}
#bubble{position:absolute;right:-18px;top:-10px;font-size:30px;background:#fff;border:2.5px solid var(--ink);border-radius:50%;width:50px;height:50px;display:grid;place-items:center;transform:rotate(8deg)}
.btn{border:3px solid var(--ink);border-radius:18px;padding:13px 26px;font-size:20px;cursor:pointer;color:var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);transition:transform .12s,box-shadow .12s;touch-action:manipulation}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.main{background:var(--red);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.sun{background:var(--sun)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:14px;justify-content:center;align-items:center;min-height:64px}
#yes{--s:1;transform:scale(var(--s));transition:transform .3s cubic-bezier(.34,1.56,.64,1);font-size:22px;padding:14px 34px}
#yes:active{transform:scale(calc(var(--s)*.95))}
#no{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#no.fly{position:fixed;left:0;top:0;z-index:60;transition:transform .28s cubic-bezier(.34,1.56,.64,1);will-change:transform}
#tease{min-height:22px;margin:26px 0 0;font-size:14px;color:#7a6455}
.badge{display:inline-block;font-family:'Jua';font-size:14px;padding:4px 14px;border:2.5px solid var(--ink);border-radius:99px;background:var(--mint);margin-bottom:10px}
.label{font-family:'Jua';font-size:15px;text-align:left;margin:14px 0 8px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 12px;margin:0 -4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.chip{flex:0 0 auto;border:2.5px solid var(--ink);border-radius:16px;background:#fff;padding:8px 12px;min-width:66px;font-size:17px;cursor:pointer;color:var(--ink);scroll-snap-align:start;line-height:1.2}
.chip small{display:block;font-family:'Noto Sans KR';font-size:11px;color:#7a6455}
.chip.we{background:#ffe4dc}
.chip.on{background:var(--sun);box-shadow:0 3px 0 var(--ink);transform:translateY(-2px)}
.grid{display:grid;gap:8px}
.times{grid-template-columns:repeat(4,1fr)}
.times .chip{min-width:0;padding:10px 2px}
.foods{grid-template-columns:repeat(3,1fr);margin-bottom:12px}
.foods .chip{padding:12px 4px;font-size:16px}
.foods .chip span{display:block;font-size:30px;line-height:1.1;margin-bottom:2px}
.foods .chip.hl{background:var(--sun);transform:scale(1.06)}
.foods .chip.on{background:var(--sun);transform:translateY(-2px) scale(1.04)}
.err{min-height:18px;font-size:13px;color:var(--red);margin:6px 0}
.nav{display:flex;gap:10px;margin-top:8px}
.nav .btn{font-size:17px;padding:12px 16px}.nav .grow{flex:1}
.ticket{position:relative;border:3px dashed var(--ink);border-radius:20px;background:#fff;padding:18px 14px 14px;margin:6px 0 16px;text-align:left}
.ticket .big{font-family:'Jua';font-size:clamp(22px,6.4vw,28px);line-height:1.3;text-align:center;margin:2px 0 12px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:15px;padding:8px 0;border-top:2px dotted #d9c7a0}
.kv b{font-family:'Jua';font-weight:400}
.stamp{position:absolute;right:-6px;top:-18px;transform:rotate(12deg);font-family:'Jua';font-size:20px;color:var(--red);border:3px solid var(--red);border-radius:10px;padding:2px 10px;background:#fff;animation:st .5s .3s cubic-bezier(.34,1.56,.64,1) both}
@keyframes st{from{transform:scale(3) rotate(40deg);opacity:0}}
.ps{font-size:13px;color:#7a6455;margin:0 0 16px;line-height:1.5}
.btns{display:flex;flex-direction:column;gap:10px}
.btns .btn{font-size:17px}
#modal{position:fixed;inset:0;z-index:100;background:rgba(43,29,22,.5);align-items:center;justify-content:center;padding:16px;display:none}
#modal.open{display:flex}
#modal .box{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
#modal label{display:block;font-family:'Jua';margin:12px 0 4px}
#modal input,#modal textarea{width:100%;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;font:inherit;font-size:16px}
#toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:120;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.float{animation:none}}
</style>
</head>

};
const st={lang:'ko',step:'ask',n:0,day:null,time:null,food:null,custom:{ko:{},en:{}},rolling:false};
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&r.ko&&r.en)st.custom=r}catch(_){}
const C=()=>{const b=S[st.lang],o=st.custom[st.lang]||{};const labels=Array.isArray(o.foods)&&o.foods.length===9?o.foods:b.foods;
 return Object.assign({},b,{ask:o.ask||b.ask,ps:o.ps||b.ps,F:labels.map((l,i)=>({e:FOOD_EMOJI[i],l}))})};
let tt;const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)};
const boom=(o)=>{if(typeof confetti==='function')confetti(Object.assign({colors:['#ef4a2b','#ffc94a','#3ecf9b','#2b1d16','#fff'],disableForReducedMotion:true},o))};

/* ---------- 도망가는 '안 돼' 버튼 ---------- */
const no=$('no'),yes=$('yes'),slot=$('slot'),pug=$('pug');
let fly=false,bx=0,by=0,last=0,px=-999,py=-999;
const vw=()=>document.documentElement.clientWidth,vh=()=>window.innerHeight;
function near(x,y,m){const r=no.getBoundingClientRect();return x>r.left-m&&x<r.right+m&&y>r.top-m&&y<r.bottom+m}
function place(x,y){bx=x;by=y;no.style.transform=`translate3d(${Math.round(x)}px,${Math.round(y)}px,0) scale(${Math.max(.72,1-st.n*.025).toFixed(2)})`}
function dodge(e){
  if(st.step!=='ask')return;
  if(e&&e.cancelable){e.preventDefault()}
  const now=Date.now();if(now-last<220)return;last=now;
  const c=C(),w=no.offsetWidth,h=no.offsetHeight;
  if(!fly){
    const r=no.getBoundingClientRect();fly=true;
    document.body.appendChild(no);no.classList.add('fly');
    no.style.transition='none';place(r.left,r.top);void no.offsetWidth;no.style.transition='';
    slot.style.display='none';
  }
  const pad=12,top=64,maxX=vw()-w-pad,maxY=vh()-h-pad,yr=yes.getBoundingClientRect();
  const ccx=bx+w/2,ccy=by+h/2,minD=Math.min(170,Math.min(vw(),vh())/3);
  let best=null,far=-1,fb=null;
  for(let i=0;i<50;i++){
    const x=pad+Math.random()*Math.max(1,maxX-pad),y=top+Math.random()*Math.max(1,maxY-top);
    const cx=x+w/2,cy=y+h/2,d=Math.hypot(cx-ccx,cy-ccy);
    const hit=x<yr.right+14&&x+w>yr.left-14&&y<yr.bottom+14&&y+h>yr.top-14;
    const dp=Math.hypot(cx-px,cy-py);
    if(!hit&&d>far){far=d;fb={x,y}}
    if(!hit&&d>minD&&dp>110){best={x,y};break}
  }
  best=best||fb||{x:pad,y:top};
  place(best.x,best.y);
  st.n++;
  $('tease').textContent=c.teases[Math.min(st.n-1,c.teases.length-1)]+(st.n>3?`  (${st.n})`:'');
  no.textContent=c.noLabels[Math.min(Math.floor(st.n/2),c.noLabels.length-1)];
  $('bubble').textContent=c.bubbles[Math.min(Math.floor(st.n/2),c.bubbles.length-1)];
  yes.style.setProperty('--s',Math.min(1+st.n*.04,1.3).toFixed(2));
  pug.classList.remove('wob');void pug.offsetWidth;pug.classList.add('wob');
  if(navigator.vibrate)try{navigator.vibrate(18)}catch(_){}
}
function resetNo(){
  st.n=0;
  if(fly){fly=false;no.classList.remove('fly');no.style.transform='';no.style.transition='';slot.style.display='';slot.appendChild(no)}
  no.hidden=false;yes.style.setProperty('--s',1);$('tease').textContent='';$('bubble').textContent='😐';
}
/* 마우스: 가까이 오면 도망 / 터치·펜: 누르기 직전 이미 도망 */
window.addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;if(e.pointerType==='mouse'&&st.step==='ask'&&near(e.clientX,e.clientY,36))dodge(e)},{passive:true});
document.addEventListener('pointerdown',e=>{px=e.clientX;py=e.clientY;if(st.step==='ask'&&near(e.clientX,e.clientY,e.pointerType==='mouse'?14:30)){last=0;dodge(e)}},true);
no.addEventListener('touchstart',e=>dodge(e),{passive:false});
no.addEventListener('mouseenter',dodge);
no.addEventListener('focus',()=>{last=0;dodge()});
no.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();last=0;dodge(e)});
no.addEventListener('contextmenu',e=>e.preventDefault());
const keep=()=>{if(!fly)return;const w=no.offsetWidth,h=no.offsetHeight;place(Math.min(Math.max(12,bx),Math.max(12,vw()-w-12)),Math.min(Math.max(64,by),Math.max(64,vh()-h-12)))};
window.addEventListener('resize',keep);window.addEventListener('orientationchange',()=>setTimeout(keep,250));

/* ---------- 화면 전환 / 렌더 ---------- */
const P={ask:'s-ask',yes:'s-yes',date:'s-date',food:'s-food',end:'s-end'};
function show(k){
  st.step=k;Object.entries(P).forEach(([a,id])=>$(id).classList.toggle('hidden',a!==k));
  no.hidden=k!=='ask';window.scrollTo(0,0);
  if(k==='yes'){boom({particleCount:90,spread:80,origin:{x:.2,y:.7}});boom({particleCount:90,spread:80,origin:{x:.8,y:.7}})}
  if(k==='end'){renderEnd();boom({particleCount:140,spread:100,origin:{y:.55}});setTimeout(()=>boom({particleCount:80,angle:60,spread:70,origin:{x:0,y:.7}}),300);setTimeout(()=>boom({particleCount:80,angle:120,spread:70,origin:{x:1,y:.7}}),450)}
}
const days=()=>{const a=[],t=new Date();for(let i=0;i<14;i++)a.push(new Date(t.getFullYear(),t.getMonth(),t.getDate()+i));return a};
const key=d=>`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
function renderDays(){
  const c=C(),box=$('days');box.innerHTML='';
  days().forEach((d,i)=>{const b=document.createElement('button');b.type='button';
    const wk=d.getDay()===0||d.getDay()===6;
    b.className='chip'+(wk?' we':'')+(st.day&&key(st.day)===key(d)?' on':'');
    b.innerHTML=`${i===0?c.today:i===1?c.tmr:c.fmtD(d)}<small>${c.wd[d.getDay()]}</small>`;
    b.onclick=()=>{st.day=d;renderDays();checkDate()};box.appendChild(b)});
}
function renderTimes(){
  const c=C(),box=$('times');box.innerHTML='';
  c.times.forEach(t=>{const b=document.createElement('button');b.type='button';b.className='chip'+(st.time===t?' on':'');
    b.textContent=c.fmtT(t).replace(/^(오전|오후) /,'$1\u00a0');b.style.fontSize='15px';
    b.onclick=()=>{st.time=t;renderTimes();checkDate()};box.appendChild(b)});
}
const checkDate=()=>{$('lock-date').disabled=!(st.day&&st.time)};
function renderFoods(hl){
  const c=C(),box=$('foods');box.innerHTML='';
  c.F.forEach((f,i)=>{const b=document.createElement('button');b.type='button';
    b.className='chip'+(st.food===i&&hl==null?' on':'')+(hl===i?' hl':'');
    b.innerHTML=`<span>${f.e}</span>${f.l}`;
    b.onclick=()=>{if(st.rolling)return;st.food=i;renderFoods();$('lock-food').disabled=false};box.appendChild(b)});
  $('lock-food').disabled=st.food===null||st.rolling;
}
function roll(){
  if(st.rolling)return;st.rolling=true;$('roll').disabled=true;
  const target=Math.floor(Math.random()*9);let i=Math.floor(Math.random()*9),steps=18+Math.floor(Math.random()*9),delay=60;
  const tick=()=>{renderFoods(i%9);if(steps-- >0||i%9!==target){i++;delay+=9;setTimeout(tick,delay)}else{st.rolling=false;st.food=target;$('roll').disabled=false;renderFoods();boom({particleCount:50,spread:60,origin:{y:.6}})}};
  tick();
}
function renderEnd(){
  const c=C(),f=c.F[st.food??0];
  $('e-main').textContent=c.main(f);
  $('v-date').textContent=`${c.fmtD(st.day)} (${c.wd[st.day.getDay()]})`;
  $('v-time').textContent=c.fmtT(st.time);$('v-menu').textContent=`${f.e} ${f.l}`;
  $('e-ps').textContent=c.ps;
}
const planText=()=>{const c=C(),f=c.F[st.food??0];return `${c.plan}\n${c.kd}: ${c.fmtD(st.day)} (${c.wd[st.day.getDay()]})\n${c.kt}: ${c.fmtT(st.time)}\n${c.km}: ${f.e} ${f.l}`};
function texts(){
  const c=C();document.documentElement.lang=st.lang;document.title=c.ask.replace(/\n/g,' ');
  $('b-lang').textContent=st.lang==='ko'?'EN':'한국어';
  $('t-ask').innerHTML='';c.ask.split('\n').forEach((l,i)=>{if(i)$('t-ask').appendChild(document.createElement('br'));$('t-ask').appendChild(document.createTextNode(l))});
  yes.textContent=c.yes;if(!st.n)no.textContent=c.noLabels[0];
  $('t-badge').textContent=c.badge;$('t-yes').textContent=c.yesT;$('t-yes2').textContent=c.yesS;$('go-date').textContent=c.go;
  $('t-date').textContent=c.date;$('l-day').textContent=c.day;$('l-time').textContent=c.time;$('lock-date').textContent=c.next;
  $('t-food').textContent=c.food;$('t-food2').textContent=c.foodS;$('roll').textContent=c.roll;$('back').textContent=c.back;$('lock-food').textContent=c.lock;
  $('e-badge').textContent=c.endBadge;$('e-stamp').textContent=c.stamp;$('k-date').textContent=c.kd;$('k-time').textContent=c.kt;$('k-menu').textContent=c.km;
  $('copy').textContent=c.copy;$('share').textContent=c.share;$('restart').textContent=c.restart;
  $('m-title').textContent=c.edit;$('m-l1').textContent=c.l1;$('m-l2').textContent=c.l2;$('m-l3').textContent=c.l3;$('m-reset').textContent=c.reset;$('m-save').textContent=c.save;
  renderDays();renderTimes();renderFoods();if(st.step==='end')renderEnd();
}

/* ---------- 이벤트 ---------- */
yes.onclick=()=>show('yes');
$('go-date').onclick=()=>show('date');
$('lock-date').onclick=()=>show('food');
$('back').onclick=()=>{if(!st.rolling)show('date')};
$('lock-food').onclick=()=>{if(st.food!==null&&!st.rolling)show('end')};
$('roll').onclick=roll;
$('copy').onclick=()=>{const t=planText();const ok=()=>toast(C().copied);
  const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove();ok()};
  navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(ok).catch(fb):fb()};
if(navigator.share)$('share').classList.remove('hidden');
$('share').onclick=()=>{navigator.share({text:planText()}).catch(()=>{})};
$('restart').onclick=()=>{st.day=null;st.time=null;st.food=null;checkDate();resetNo();texts();show('ask')};
$('b-lang').onclick=()=>{st.lang=st.lang==='ko'?'en':'ko';texts()};
function openM(){const c=C();$('m-ask').value=c.ask.replace(/\n/g,' ');$('m-ps').value=c.ps;$('m-foods').value=c.F.map(f=>f.l).join(', ');$('modal').classList.add('open')}
const closeM=()=>$('modal').classList.remove('open');
$('b-edit').onclick=openM;$('m-close').onclick=closeM;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeM()});
$('m-save').onclick=()=>{const b=S[st.lang];const raw=$('m-foods').value.split(',').map(s=>s.trim()).filter(Boolean);
  st.custom[st.lang]={ask:$('m-ask').value.trim()||b.ask,ps:$('m-ps').value.trim()||b.ps,foods:b.foods.map((l,i)=>raw[i]||l)};
  try{localStorage.setItem(KEY,JSON.stringify(st.custom))}catch(_){}
  texts();closeM();toast(C().saved)};
$('m-reset').onclick=()=>{st.custom[st.lang]={};try{localStorage.setItem(KEY,JSON.stringify(st.custom))}catch(_){}texts();openM()};
$('pug2').src=document.querySelector('#pug img').src;
texts();
})();
</script>
