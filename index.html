<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffc2e0">
<title>이번 주 어디서 볼까? </title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.2/dist/galmuri.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
:root{--bg1:#ffc2e0;--bg2:#ffb0d6;--ink:#4a0830;--pink:#ff3d9a;--pink2:#ff8fc8;--pale:#ffe3f1;--card:#fff5fa;--muted:#a8487e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overscroll-behavior:none}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
background:conic-gradient(var(--bg1) 25%,var(--bg2) 0 50%,var(--bg1) 0 75%,var(--bg2) 0) 0 0/40px 40px;
color:var(--ink);font-family:'Galmuri14','Galmuri11','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5;font-synthesis:none;word-break:keep-all;overflow-x:hidden;touch-action:manipulation}
button,input,textarea{font-family:inherit}
.float{position:fixed;font-size:32px;color:var(--pink);text-shadow:3px 3px 0 var(--ink);pointer-events:none;animation:fl 1.2s steps(2) infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
#hud,header button{font-size:15px;padding:4px 12px;border:4px solid var(--ink);background:#fff;color:var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:0}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;z-index:30;background:var(--pink);color:#fff}
header{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:30}
header button{cursor:pointer}
main{width:100%;max-width:440px;position:relative;z-index:5;margin-top:36px}
.card{background:var(--card);border:4px solid var(--ink);border-radius:0;box-shadow:inset -4px -4px 0 var(--pale),inset 4px 4px 0 #fff,8px 8px 0 var(--ink);padding:28px 22px 26px;text-align:center;animation:pop .3s steps(4)}
.bar{margin:-28px -22px 22px;padding:5px 12px;background:var(--pink);color:#fff;border-bottom:4px solid var(--ink);display:flex;justify-content:space-between;text-align:left}
.hidden{display:none!important}
@keyframes pop{from{opacity:0;transform:translateY(12px)}}
h1,h2{font-weight:400;font-size:30px;line-height:1.4;margin:0}
h1{margin:8px 0 22px;white-space:pre-line;min-height:84px}
h2{margin:4px 0 8px}
.typing::after{content:'▌';color:var(--pink);animation:bl .5s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.sub{color:var(--muted);margin:0 0 18px}
.pug{position:relative;width:152px;height:152px;margin:0 auto 18px;border:4px solid var(--ink);background:var(--pale);box-shadow:6px 6px 0 var(--pink)}
.pug .mascot{display:block;width:100%;height:100%;image-rendering:pixelated}
img.mascot{visibility:hidden}
.pug.wob .mascot{animation:wob .4s steps(4)}
.pug.dance .mascot{animation:wob .6s steps(4) infinite}
@keyframes wob{25%{transform:translate(-6px,0)}50%{transform:translate(6px,-6px)}75%{transform:translate(-6px,0)}}
.bub{position:absolute;right:-22px;top:-20px;font-size:26px;line-height:1;background:#fff;border:4px solid var(--ink);width:52px;height:52px;display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink)}
.btn{border:4px solid var(--ink);border-radius:0;padding:8px 22px;font-size:30px;line-height:1.4;cursor:pointer;color:var(--ink);background:#fff;box-shadow:0 6px 0 var(--ink);transition:none;touch-action:manipulation}
.btn:active:not(:disabled){transform:translateY(6px);box-shadow:0 0 0 var(--ink)}
.btn.main{background:var(--pink);color:#fff;text-shadow:3px 3px 0 var(--ink)}
.btn.soft{background:var(--pink2)}
.btn.sm{font-size:15px;padding:10px 14px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 6px 0 var(--ink)}
.row{display:flex;gap:14px;justify-content:center;align-items:center;min-height:84px}
#yes,#no{width:154px;padding:10px 12px;text-align:center;white-space:nowrap}
#yes{--s:1;position:relative;z-index:20;transform:scale(var(--s));transition:transform .22s steps(4)}
#yes:active{transform:scale(calc(var(--s)*.95))}
#no{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#no.fly{position:fixed;left:0;top:0;z-index:60;transition:transform .2s steps(4);will-change:transform}
#tease{min-height:24px;margin:30px 0 0;color:var(--muted);font-size:15px}
.badge{display:inline-block;padding:2px 12px;border:4px solid var(--ink);background:var(--pink2);margin-bottom:10px;box-shadow:3px 3px 0 var(--ink)}
.label{text-align:left;margin:14px 0 8px;color:var(--pink);text-shadow:1px 1px 0 var(--ink)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 14px;margin:0 -4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.chip{flex:0 0 auto;border:4px solid var(--ink);border-radius:0;background:#fff;padding:6px 12px;min-width:76px;font-size:15px;cursor:pointer;color:var(--ink);scroll-snap-align:start;line-height:1.4;box-shadow:0 4px 0 var(--ink)}
.chip small{display:block;font-family:'Galmuri11',inherit;font-size:12px;color:var(--muted)}
.chip.we{background:var(--pale)}
.chip.on,.chip.hl{background:var(--pink);color:#fff;transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.chip.on small{color:#ffe3f1}
.grid{display:grid;gap:10px}
.times{grid-template-columns:repeat(2,1fr)}
.times .chip{min-width:0;padding:8px 4px}
.foods{grid-template-columns:repeat(3,1fr);margin-bottom:14px}
.foods.editing{grid-template-columns:1fr;max-height:250px;overflow-y:auto;padding-right:2px}
.foods .chip{padding:10px 2px}
.foods .chip span{display:block;font-size:30px;line-height:1.2}
.fadd{display:flex;gap:8px;margin-bottom:14px}
.fadd input{flex:1;min-width:0;padding:8px 10px;border:4px solid var(--ink);border-radius:0;font-size:15px;background:#fff;color:var(--ink)}
.fadd input:focus{outline:none;background:var(--pale)}
.fedit-row{display:grid;grid-template-columns:56px 1fr 42px;gap:6px;align-items:center}
.fedit-row input{width:100%;padding:6px 8px;border:4px solid var(--ink);border-radius:0;font-size:15px;background:#fff;color:var(--ink)}
.fedit-row input:first-child{text-align:center;font-size:20px;padding:4px}
.fdel{border:4px solid var(--ink);background:var(--pale);color:var(--ink);height:40px;font-size:15px;cursor:pointer;padding:0}
.fdel:hover{background:var(--pink);color:#fff}
.nav{display:flex;gap:10px;margin-top:8px}
.nav .grow{flex:1}
.ticket{position:relative;border:4px dashed var(--ink);background:#fff;padding:20px 14px 12px;margin:10px 0 18px;text-align:left}
.ticket .big{font-size:30px;line-height:1.4;text-align:center;margin:0 0 12px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:4px dotted var(--pink2)}
.kv b{font-weight:400}
.stamp{position:absolute;right:-8px;top:-20px;color:var(--pink);border:4px solid var(--pink);padding:0 10px;background:#fff;font-size:15px;animation:st .5s .2s steps(5) both}
@keyframes st{from{transform:scale(3);opacity:0}}
.ps{font-size:15px;color:var(--muted);margin:0 0 18px;white-space:pre-line}
.btns{display:flex;flex-direction:column;gap:14px}
#modal{position:fixed;inset:0;z-index:100;background:rgba(74,8,48,.6);align-items:flex-start;justify-content:center;padding:14px;display:none;overflow:auto}
#modal.open{display:flex}
#modal .box{background:#fff;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:18px;width:100%;max-width:460px;margin:auto}
#modal h3{font-weight:400;font-size:30px;margin:0}
#modal .sec{color:var(--pink);text-shadow:1px 1px 0 var(--ink);margin:20px 0 2px}
#modal label{display:block;font-family:'Galmuri11',inherit;font-size:12px;color:var(--muted);margin:10px 0 4px}
#modal input,#modal textarea{width:100%;padding:8px 10px;border:4px solid var(--ink);border-radius:0;font-size:15px;background:var(--card);color:var(--ink)}
.frow{display:grid;grid-template-columns:56px 1fr 42px;gap:8px;margin-bottom:8px;align-items:center}
.frow input:first-child{text-align:center;font-size:20px;padding:4px}
.mbar{position:sticky;bottom:-18px;background:#fff;margin:16px -18px -18px;padding:12px 18px;border-top:4px solid var(--ink);display:flex;gap:10px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border:4px solid #fff;outline:4px solid var(--ink);opacity:0;pointer-events:none;z-index:120;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.float,.pug.dance .mascot,.typing::after{animation:none}}
</style>
</head>
<body>
<span class="float" style="left:6%;top:14%">♥</span><span class="float" style="right:8%;top:22%;animation-delay:-.4s">★</span>
<span class="float" style="left:9%;bottom:12%;animation-delay:-.8s">★</span><span class="float" style="right:6%;bottom:9%;animation-delay:-.2s">♥</span>

<div id="hud">★ STAGE 1/3</div>
<header><button id="b-edit" type="button">✏ 수정</button></header>

<main>
  <section id="s-ask" class="card">
    <div class="bar"><span>♥ 밥먹자 퀘스트</span><span>_ □ x</span></div>
    <div class="pug" id="pug"><img class="mascot" alt="퍼그 마스코트"><div class="bub" id="bubble">😐</div></div>
    <h1 id="t-ask"></h1>
    <div class="row">
      <button id="yes" class="btn main" type="button"></button>
      <span id="slot"><button id="no" class="btn" type="button"></button></span>
    </div>
    <p id="tease"></p>
  </section>

  <section id="s-yes" class="card hidden">
    <div class="bar"><span>♥ 수락 완료!</span><span>_ □ x</span></div>
    <div class="pug dance"><img class="mascot" alt="기뻐하는 퍼그 마스코트"><div class="bub">🥳</div></div>
    <span class="badge">수락 완료 ✓</span>
    <h2 id="t-yes"></h2>
    <p class="sub" id="t-yes2"></p>
    <button id="go-date" class="btn main" type="button"></button>
  </section>

  <section id="s-date" class="card hidden">
    <div class="bar"><span>♥ STAGE 2 : 날짜</span><span>_ □ x</span></div>
    <h2 id="t-date"></h2>
    <div class="label">▶ 날짜</div>
    <div class="strip" id="days"></div>
    <div class="label">▶ 시간</div>
    <div class="grid times" id="times"></div>
    <p class="err" style="min-height:10px"></p>
    <button id="lock-date" class="btn main" style="width:100%" type="button" disabled>다음으로 →</button>
  </section>

  <section id="s-food" class="card hidden">
    <div class="bar"><span>♥ STAGE 3 : 메뉴</span><span>_ □ x</span></div>
    <h2 id="t-food"></h2>
    <p class="sub" id="t-food2"></p>
    <div class="grid foods" id="foods"></div>
    <div class="fadd">
      <input id="food-custom" type="text" maxlength="16" placeholder="직접 입력 (예: 돈까스)" aria-label="음식 메뉴 직접 입력">
      <button id="food-add" class="btn sm soft" type="button">+ 추가</button>
    </div>
    <div class="nav" style="margin-bottom:14px">
      <button id="roll" class="btn sm soft grow" type="button">🎲 룰렛</button>
      <button id="food-edit-toggle" class="btn sm" type="button">✏ 메뉴 수정</button>
    </div>
    <div class="nav">
      <button id="back" class="btn sm" type="button">← 이전</button>
      <button id="lock-food" class="btn main grow" type="button" disabled>확정하기</button>
    </div>
  </section>

  <section id="s-end" class="card hidden">
    <div class="bar"><span>★ STAGE CLEAR!</span><span>_ □ x</span></div>
    <span class="badge">약속 확정 ♥</span>
    <div class="ticket">
      <div class="stamp">CLEAR!</div>
      <div class="big" id="e-main"></div>
      <div class="kv"><span>날짜</span><b id="v-date"></b></div>
      <div class="kv"><span>시간</span><b id="v-time"></b></div>
      <div class="kv"><span>메뉴</span><b id="v-menu"></b></div>
    </div>
    <p class="ps" id="e-ps"></p>
    <div class="btns">
      <button id="copy" class="btn main" type="button">약속 내용 복사</button>
      <button id="share" class="btn sm soft hidden" type="button">카톡/문자로 보내기</button>
      <button id="restart" class="btn sm" type="button">다시 하기</button>
    </div>
  </section>
</main>

<div id="modal"><div class="box">
  <div style="display:flex;justify-content:space-between;align-items:center"><h3>✏ 내용 수정</h3><button id="m-close" class="btn sm" type="button">✕</button></div>

  <div class="sec">▶ 첫 화면</div>
  <label for="m-ask">질문 (줄바꿈 가능)</label><textarea id="m-ask" rows="2"></textarea>
  <label for="m-yes">좋아 버튼</label><input id="m-yes">
  <label for="m-no">안 돼 버튼</label><input id="m-no">
  <label for="m-teases">도망갈 때 나오는 멘트 (한 줄에 하나씩)</label><textarea id="m-teases" rows="5"></textarea>

  <div class="sec">▶ 수락했을 때</div>
  <label for="m-yesT">제목</label><input id="m-yesT">
  <label for="m-yesS">부제</label><input id="m-yesS">

  <div class="sec">▶ 메뉴 목록 (이모지 + 이름)</div>
  <div id="m-foods"></div>
  <button id="m-add-food" class="btn sm soft" style="width:100%;margin-top:6px" type="button">+ 메뉴 추가</button>
  <label for="m-times">고를 수 있는 시간 (쉼표로, 24시간제)</label><input id="m-times" placeholder="12:00, 18:00, 19:30">

  <div class="sec">▶ 마지막 화면</div>
  <label for="m-end">확정 문구 ({메뉴} 자리에 고른 메뉴가 들어가요)</label><input id="m-end">
  <label for="m-ps">P.S. 한마디</label><textarea id="m-ps" rows="2"></textarea>

  <div class="mbar">
    <button id="m-save" class="btn sm main" type="button">저장</button>
    <button id="m-link" class="btn sm soft" type="button">🔗 링크 복사</button>
    <button id="m-reset" class="btn sm" type="button">기본값</button>
  </div>
  <p class="sub" style="margin:14px 0 0;font-size:12px">※ 상대에게는 <b>🔗 링크 복사</b>로 만든 링크를 보내면, 수정한 내용 그대로 보여요.</p>
</div></div>
<div id="toast"></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const KEY='date_invite_cfg_v4';
const DEF={
 ask:'이번 주에 시간 괜찮아?\n같이 밥 먹자 🍚',yes:'좋아 😊',no:'안 돼',
 teases:[
   '어? 버튼이 도망갔네',
   '살짝 비켜갔어',
   '퍼그가 눈치 보는 중 👀',
   '버튼이 좀 쑥스러운가 봐',
   '오, 반응속도 빠른데?',
   '안 돼 버튼 지금 운동 중 🏃',
   '한 번만 같이 먹어줘 🥺',
   '맛있는 거 먹으러 가자 🍽️',
   '손가락 아프겠다 잠깐 쉬어',
   '이쯤 되면 미니게임인데?',
   '퍼그도 같이 가고 싶대 🐶',
   '시간 괜찮으면 "좋아" 눌러줘'
 ],
 yesT:'오, 고마워!',yesS:'거절하면 어쩌나 살짝 긴장했는데 다행이다',go:'일정 정하기 →',
 dateT:'언제가 편해?',foodT:'뭐 먹을까?',foodS:'고르거나 직접 입력·수정할 수 있어!',
 end:'{메뉴} 먹으러 가자!',ps:'P.S. 카톡으로 물어봐도 되는데 재미로 한 번 만들어 봤어. 편한 시간으로 골라줘!',
 foods:[['🍕','피자'],['🍣','스시'],['🍔','버거'],['🍝','파스타'],['🌮','타코'],['🍜','라멘'],['🥓','삼겹살'],['🍗','치킨'],['🌶️','떡볶이']],
 times:'11:30,12:00,13:00,17:00,18:00,19:00,20:00,21:00'
};
const BUBBLES=['😐','😮','🤨','😏','🥺','😅','🤣'],NOS=['','안 돼?','진짜?','어라?','잠깐만','헉','살려줘','…'];
const WD=['일','월','화','수','목','금','토'];
const clone=o=>JSON.parse(JSON.stringify(o));
let CFG=clone(DEF),fromLink=false;
function merge(o){if(!o||typeof o!=='object')return;
 for(const k of Object.keys(DEF)){if(o[k]==null||o[k]==='')continue;
  if(k==='foods'){
    if(Array.isArray(o.foods)&&o.foods.length){
      const clean=o.foods.map(f=>[String((f&&f[0])||'🍽️').trim()||'🍽️',String((f&&f[1])||'').trim()]).filter(f=>f[1]);
      if(clean.length)CFG.foods=clean;
    }
  }
  else if(k==='teases'){if(Array.isArray(o.teases)&&o.teases.length)CFG.teases=o.teases.map(String)}
  else CFG[k]=String(o[k])}}
const enc=o=>{const b=new TextEncoder().encode(JSON.stringify(o));let s='';b.forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const dec=s=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))));
try{const m=location.hash.match(/^#c=(.+)$/);if(m){merge(dec(decodeURIComponent(m[1])));fromLink=true}}catch(_){}
if(!fromLink)try{merge(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(_){}
if(fromLink&&!/[?&]edit/.test(location.search))$('b-edit').classList.add('hidden');
const saveCfg=()=>{try{localStorage.setItem(KEY,JSON.stringify(CFG))}catch(_){}};

/* 마스코트: 저장소의 mascot.jpg를 도트(48x48)로 변환해서 표시 (없으면 🐶) */
const FALL='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="#ffd3ea"/><text x="50" y="68" font-size="60" text-anchor="middle">🐶</text></svg>');
function pixelate(img){
  const n=48,c=document.createElement('canvas');c.width=n;c.height=n;c.className='mascot';
  const x=c.getContext('2d'),w=img.naturalWidth||100,h=img.naturalHeight||100,m=Math.min(w,h);
  x.drawImage(img,(w-m)/2,(h-m)/2,m,m,0,0,n,n);
  try{const d=x.getImageData(0,0,n,n),p=d.data;for(let i=0;i<p.length;i+=4){for(let k=0;k<3;k++)p[i+k]=Math.round(p[i+k]/51)*51}x.putImageData(d,0,0)}catch(_){}
  img.replaceWith(c);
}
document.querySelectorAll('img.mascot').forEach(i=>{i.onerror=()=>{i.onerror=null;i.src=FALL};i.onload=()=>pixelate(i);i.src='mascot.jpg'});

let tt;const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)};
const boom=o=>{if(typeof confetti==='function')confetti(Object.assign({shapes:['square'],scalar:1.4,colors:['#ff3d9a','#ff8fc8','#ffe3f1','#4a0830','#fff'],disableForReducedMotion:true},o))};
const st={step:'ask',n:0,day:null,time:null,food:null,customFood:'',editingFoods:false,rolling:false};
const TIMES=()=>{const a=CFG.times.split(',').map(s=>s.trim()).filter(s=>/^\d{1,2}:\d{2}$/.test(s));return (a.length?a:DEF.times.split(',')).slice(0,12)};
const fmtT=t=>{const[h,m]=t.split(':').map(Number);return `${h<12?'오전':'오후'} ${h>12?h-12:h||12}:${String(m).padStart(2,'0')}`};
const fmtD=d=>`${d.getMonth()+1}월 ${d.getDate()}일`;

/* ---------- 도망가는 '안 돼' 버튼 ---------- */
const no=$('no'),yes=$('yes'),slot=$('slot'),pug=$('pug');
let fly=false,bx=0,by=0,last=0,px=-999,py=-999;
const vw=()=>document.documentElement.clientWidth,vh=()=>window.innerHeight;
function near(x,y,m){const r=no.getBoundingClientRect();return x>r.left-m&&x<r.right+m&&y>r.top-m&&y<r.bottom+m}
function place(x,y){bx=x;by=y;no.style.transform=`translate3d(${Math.round(x)}px,${Math.round(y)}px,0) scale(${Math.max(.72,1-st.n*.025).toFixed(2)})`}
function noLabel(){const i=Math.min(Math.floor(st.n/2),NOS.length-1);no.textContent=i?NOS[i]:CFG.no}
function dodge(e){
  if(st.step!=='ask')return;
  if(e&&e.cancelable)e.preventDefault();
  const now=Date.now();if(now-last<220)return;last=now;
  const w=no.offsetWidth,h=no.offsetHeight;
  if(!fly){
    const r=no.getBoundingClientRect();fly=true;
    document.body.appendChild(no);no.classList.add('fly');
    no.style.transition='none';place(r.left,r.top);void no.offsetWidth;no.style.transition='';
    slot.style.display='none';
  }
  const pad=12,top=64,maxX=vw()-w-pad,maxY=vh()-h-pad,yr=yes.getBoundingClientRect();
  const ccx=bx+w/2,ccy=by+h/2,minD=Math.min(170,Math.min(vw(),vh())/3);
  let best=null,far=-1,fb=null;
  for(let i=0;i<50;i++){
    const x=pad+Math.random()*Math.max(1,maxX-pad),y=top+Math.random()*Math.max(1,maxY-top);
    const cx=x+w/2,cy=y+h/2,d=Math.hypot(cx-ccx,cy-ccy);
    const hit=x<yr.right+14&&x+w>yr.left-14&&y<yr.bottom+14&&y+h>yr.top-14;
    if(!hit&&d>far){far=d;fb={x,y}}
    if(!hit&&d>minD&&Math.hypot(cx-px,cy-py)>110){best={x,y};break}
  }
  best=best||fb||{x:pad,y:top};
  place(best.x,best.y);
  st.n++;
  const T=CFG.teases;
  $('tease').textContent=T[Math.min(st.n-1,T.length-1)]+(st.n>3?`  (${st.n})`:'');
  noLabel();
  $('bubble').textContent=BUBBLES[Math.min(Math.floor(st.n/2),BUBBLES.length-1)];
  yes.style.setProperty('--s',Math.min(1+st.n*.15,2.2).toFixed(2));
  pug.classList.remove('wob');void pug.offsetWidth;pug.classList.add('wob');
  if(navigator.vibrate)try{navigator.vibrate(18)}catch(_){}
}
function resetNo(){
  st.n=0;
  if(fly){fly=false;no.classList.remove('fly');no.style.transform='';no.style.transition='';slot.style.display='';slot.appendChild(no)}
  no.hidden=false;no.textContent=CFG.no;yes.style.setProperty('--s',1);$('tease').textContent='';$('bubble').textContent='😐';
}
window.addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;if(e.pointerType==='mouse'&&st.step==='ask'&&near(e.clientX,e.clientY,36))dodge(e)},{passive:true});
document.addEventListener('pointerdown',e=>{px=e.clientX;py=e.clientY;if(st.step==='ask'&&near(e.clientX,e.clientY,e.pointerType==='mouse'?14:30)){last=0;dodge(e)}},true);
no.addEventListener('touchstart',e=>dodge(e),{passive:false});
no.addEventListener('mouseenter',dodge);
no.addEventListener('focus',()=>{last=0;dodge()});
no.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();last=0;dodge(e)});
no.addEventListener('contextmenu',e=>e.preventDefault());
const keep=()=>{if(!fly)return;const w=no.offsetWidth,h=no.offsetHeight;place(Math.min(Math.max(12,bx),Math.max(12,vw()-w-12)),Math.min(Math.max(64,by),Math.max(64,vh()-h-12)))};
window.addEventListener('resize',keep);window.addEventListener('orientationchange',()=>setTimeout(keep,250));

/* ---------- 화면 ---------- */
const P={ask:'s-ask',yes:'s-yes',date:'s-date',food:'s-food',end:'s-end'};
const HUD={ask:'STAGE 1/3',yes:'STAGE 1/3',date:'STAGE 2/3',food:'STAGE 3/3',end:'CLEAR!'};
function show(k){
  st.step=k;$('hud').textContent='★ '+HUD[k];Object.entries(P).forEach(([a,id])=>$(id).classList.toggle('hidden',a!==k));
  no.hidden=k!=='ask';window.scrollTo(0,0);
  if(k==='yes'){boom({particleCount:90,spread:80,origin:{x:.2,y:.7}});boom({particleCount:90,spread:80,origin:{x:.8,y:.7}})}
  if(k==='end'){renderEnd();boom({particleCount:140,spread:100,origin:{y:.55}});setTimeout(()=>boom({particleCount:80,angle:60,spread:70,origin:{x:0,y:.7}}),300);setTimeout(()=>boom({particleCount:80,angle:120,spread:70,origin:{x:1,y:.7}}),450)}
}
const dayList=()=>{const a=[],t=new Date();for(let i=0;i<14;i++)a.push(new Date(t.getFullYear(),t.getMonth(),t.getDate()+i));return a};
const same=(a,b)=>a&&b&&a.getTime()===b.getTime();
function renderDays(){
  const box=$('days');box.innerHTML='';
  dayList().forEach((d,i)=>{const b=document.createElement('button');b.type='button';
    b.className='chip'+(d.getDay()%6===0?' we':'')+(same(st.day,d)?' on':'');
    b.innerHTML=`${i===0?'오늘':i===1?'내일':fmtD(d)}<small>${WD[d.getDay()]}요일</small>`;
    b.onclick=()=>{st.day=d;renderDays();checkDate()};box.appendChild(b)});
}
function renderTimes(){
  const box=$('times');box.innerHTML='';
  TIMES().forEach(t=>{const b=document.createElement('button');b.type='button';b.className='chip'+(st.time===t?' on':'');
    b.textContent=fmtT(t);b.onclick=()=>{st.time=t;renderTimes();checkDate()};box.appendChild(b)});
}
const checkDate=()=>{$('lock-date').disabled=!(st.day&&st.time)};
const hasFood=()=>st.customFood.trim().length>0||(st.food!==null&&!!CFG.foods[st.food]);
const food=()=>{
  const c=st.customFood.trim();
  if(c)return['🍽️',c];
  return CFG.foods[st.food??0]||['🍽️','맛있는 거'];
};
function updateFoodBtns(){
  $('lock-food').disabled=!hasFood()||st.rolling||st.editingFoods;
  $('roll').disabled=st.rolling||st.editingFoods||CFG.foods.length<2;
  $('food-edit-toggle').textContent=st.editingFoods?'✓ 수정 완료':'✏ 메뉴 수정';
}
function renderFoods(hl){
  const box=$('foods');box.innerHTML='';
  box.classList.toggle('editing',st.editingFoods);
  if(st.editingFoods){
    CFG.foods.forEach((f,i)=>{
      const row=document.createElement('div');row.className='fedit-row';
      const em=document.createElement('input');em.maxLength=4;em.value=f[0];em.setAttribute('aria-label','이모지');
      const nm=document.createElement('input');nm.maxLength=12;nm.value=f[1];nm.setAttribute('aria-label','메뉴 이름');
      const del=document.createElement('button');del.type='button';del.className='fdel';del.textContent='✕';del.setAttribute('aria-label','메뉴 삭제');
      em.oninput=()=>{CFG.foods[i][0]=em.value.trim()||'🍽️';saveCfg()};
      nm.oninput=()=>{CFG.foods[i][1]=nm.value.trim()||'메뉴';saveCfg()};
      del.onclick=()=>{
        if(CFG.foods.length<=1){toast('메뉴는 최소 1개는 남겨줘!');return}
        CFG.foods.splice(i,1);
        if(st.food===i)st.food=null;
        else if(st.food>i)st.food--;
        saveCfg();renderFoods();
      };
      row.append(em,nm,del);box.appendChild(row);
    });
  }else{
    CFG.foods.forEach((f,i)=>{const b=document.createElement('button');b.type='button';
      b.className='chip'+(st.food===i&&!st.customFood.trim()&&hl==null?' on':'')+(hl===i?' hl':'');
      const s=document.createElement('span');s.textContent=f[0];b.appendChild(s);b.appendChild(document.createTextNode(f[1]));
      b.onclick=()=>{if(st.rolling)return;st.food=i;st.customFood='';$('food-custom').value='';renderFoods()};box.appendChild(b)});
  }
  updateFoodBtns();
}
function addFoodFromInput(){
  const raw=$('food-custom').value.trim();
  if(!raw){toast('추가할 메뉴 이름을 먼저 적어줘!');$('food-custom').focus();return}
  CFG.foods.push(['🍽️',raw]);
  st.food=CFG.foods.length-1;
  st.customFood='';
  $('food-custom').value='';
  saveCfg();
  renderFoods();
  toast(`"${raw}" 메뉴에 추가됐어!`);
}
function roll(){
  const len=CFG.foods.length;
  if(st.rolling||st.editingFoods||len<2)return;
  st.rolling=true;st.customFood='';$('food-custom').value='';updateFoodBtns();
  const target=Math.floor(Math.random()*len);let i=Math.floor(Math.random()*len),steps=18+Math.floor(Math.random()*len),delay=60;
  const tick=()=>{renderFoods(i%len);if(steps-- >0||i%len!==target){i++;delay+=9;setTimeout(tick,delay)}else{st.rolling=false;st.food=target;renderFoods();boom({particleCount:50,spread:60,origin:{y:.6}})}};
  tick();
}
function renderEnd(){
  const f=food();
  $('e-main').textContent=CFG.end.replace('{메뉴}',`${f[0]} ${f[1]}`);
  $('v-date').textContent=`${fmtD(st.day)} (${WD[st.day.getDay()]})`;$('v-time').textContent=fmtT(st.time);$('v-menu').textContent=`${f[0]} ${f[1]}`;
  $('e-ps').textContent=CFG.ps;
}
const planText=()=>`[약속 확정]\n날짜: ${fmtD(st.day)} (${WD[st.day.getDay()]})\n시간: ${fmtT(st.time)}\n메뉴: ${food()[0]} ${food()[1]}`;
let typeT;
function setAsk(anim){clearInterval(typeT);const t=$('t-ask'),a=Array.from(CFG.ask);
  if(!anim||matchMedia('(prefers-reduced-motion:reduce)').matches){t.textContent=CFG.ask;t.classList.remove('typing');return}
  let i=0;t.textContent='';t.classList.add('typing');
  typeT=setInterval(()=>{t.textContent=a.slice(0,++i).join('');if(i>=a.length){clearInterval(typeT);t.classList.remove('typing')}},70)}
function texts(anim){
  document.title=CFG.ask.replace(/\n/g,' ');
  setAsk(anim);
  yes.textContent=CFG.yes;if(!st.n)no.textContent=CFG.no;
  $('t-yes').textContent=CFG.yesT;$('t-yes2').textContent=CFG.yesS;$('go-date').textContent=CFG.go;
  $('t-date').textContent=CFG.dateT;$('t-food').textContent=CFG.foodT;$('t-food2').textContent=CFG.foodS;
  renderDays();renderTimes();renderFoods();if(st.step==='end')renderEnd();
}

/* ---------- 이벤트 ---------- */
yes.onclick=()=>show('yes');
$('go-date').onclick=()=>show('date');
$('lock-date').onclick=()=>show('food');
$('back').onclick=()=>{if(!st.rolling){st.editingFoods=false;show('date')}};
$('lock-food').onclick=()=>{if(hasFood()&&!st.rolling&&!st.editingFoods)show('end')};
$('roll').onclick=roll;
$('food-custom').addEventListener('input',e=>{
  st.customFood=e.target.value;
  if(st.customFood.trim()){st.food=null;renderFoods()}else{updateFoodBtns()}
});
$('food-custom').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addFoodFromInput()}});
$('food-add').onclick=addFoodFromInput;
$('food-edit-toggle').onclick=()=>{
  if(st.rolling)return;
  st.editingFoods=!st.editingFoods;
  if(!st.editingFoods)toast('메뉴 수정이 저장됐어!');
  renderFoods();
};
$('copy').onclick=()=>{const t=planText(),ok=()=>toast('복사됐어! 붙여넣어서 보내면 돼 📋');
  const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove();ok()};
  navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(ok).catch(fb):fb()};
if(navigator.share)$('share').classList.remove('hidden');
$('share').onclick=()=>{navigator.share({text:planText()}).catch(()=>{})};
$('restart').onclick=()=>{st.day=null;st.time=null;st.food=null;st.customFood='';st.editingFoods=false;$('food-custom').value='';checkDate();resetNo();texts(true);show('ask')};

/* ---------- 수정 화면 ---------- */
function appendModalFoodRow(emVal,nmVal){
  const box=$('m-foods');
  const r=document.createElement('div');r.className='frow';
  const em=document.createElement('input');em.maxLength=4;em.value=emVal;em.setAttribute('aria-label','이모지');
  const nm=document.createElement('input');nm.maxLength=12;nm.value=nmVal;nm.setAttribute('aria-label','메뉴 이름');
  const del=document.createElement('button');del.type='button';del.className='fdel';del.textContent='✕';del.setAttribute('aria-label','메뉴 삭제');
  del.onclick=()=>{if(box.children.length<=1){toast('메뉴는 최소 1개는 남겨줘!');return}r.remove()};
  r.append(em,nm,del);box.appendChild(r);
}
function fillModal(){
  $('m-ask').value=CFG.ask;$('m-yes').value=CFG.yes;$('m-no').value=CFG.no;$('m-teases').value=CFG.teases.join('\n');
  $('m-yesT').value=CFG.yesT;$('m-yesS').value=CFG.yesS;$('m-times').value=CFG.times;$('m-end').value=CFG.end;$('m-ps').value=CFG.ps;
  const box=$('m-foods');box.innerHTML='';
  CFG.foods.forEach(f=>appendModalFoodRow(f[0],f[1]));
}
function readModal(){
  const v=id=>$(id).value.trim();
  const foods=[...$('m-foods').children]
    .map(r=>[r.children[0].value.trim()||'🍽️',r.children[1].value.trim()])
    .filter(f=>f[1]);
  return{ask:$('m-ask').value.trim(),yes:v('m-yes'),no:v('m-no'),teases:$('m-teases').value.split('\n').map(s=>s.trim()).filter(Boolean),
   yesT:v('m-yesT'),yesS:v('m-yesS'),times:v('m-times'),end:v('m-end'),ps:$('m-ps').value.trim(),
   foods:foods.length?foods:clone(DEF.foods)};
}
function apply(o){CFG=clone(DEF);merge(o);if(st.food!==null&&st.food>=CFG.foods.length)st.food=null;resetNo();texts()}
const openM=()=>{fillModal();$('modal').classList.add('open')},closeM=()=>$('modal').classList.remove('open');
$('b-edit').onclick=openM;$('m-close').onclick=closeM;
$('m-add-food').onclick=()=>{appendModalFoodRow('🍽️','');const last=$('m-foods').lastElementChild;if(last)last.children[1].focus()};
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeM()});
$('m-save').onclick=()=>{const o=readModal();apply(o);saveCfg();closeM();toast('저장됐어! 🔗 링크 복사로 상대에게 보내요')};
$('m-link').onclick=()=>{const o=readModal();apply(o);saveCfg();
  const url=location.origin==='null'||location.protocol==='file:'?location.href.split('#')[0]+'#c='+encodeURIComponent(enc(CFG)):location.origin+location.pathname+'#c='+encodeURIComponent(enc(CFG));
  const ok=()=>toast('링크 복사 완료! 이걸 보내면 수정한 내용이 보여요 💌');
  const fb=()=>{const a=document.createElement('textarea');a.value=url;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove();ok()};
  navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(url).then(ok).catch(fb):fb()};
$('m-reset').onclick=()=>{try{localStorage.removeItem(KEY)}catch(_){}apply(null);fillModal();toast('기본값으로 돌렸어')};
texts(true);
})();
</script>
</body>
</html>
