<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffc2e0">
<title>밥 먹자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hi+Melody&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
:root{--bg:#ffc9e3;--ink:#5a0f3a;--pink:#ff4fa3;--pink2:#ff93c9;--pale:#ffe6f2;--card:#fff8fc;--muted:#b0588a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overscroll-behavior:none}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
background:radial-gradient(circle at 20% 10%,#ffe3f1 0,transparent 45%),radial-gradient(circle at 85% 90%,#ff9fcf 0,transparent 50%),var(--bg);
color:var(--ink);font-family:'Gowun Dodum','Noto Sans KR',system-ui,sans-serif;overflow-x:hidden;touch-action:manipulation}
h1,h2,button,.chip,h3{font-family:'Hi Melody','Gowun Dodum',sans-serif;font-weight:400}
.float{position:fixed;font-size:28px;opacity:.7;pointer-events:none;animation:fl 8s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-16px) rotate(12deg) scale(1.1)}}
header{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:30}
header button{font-size:17px;padding:7px 14px;border-radius:99px;border:2.5px solid var(--ink);background:#fff;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
main{width:100%;max-width:440px;position:relative;z-index:5}
.card{background:var(--card);border:3px solid var(--ink);border-radius:30px;box-shadow:8px 8px 0 var(--pink);padding:28px 22px 26px;text-align:center;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.hidden{display:none!important}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.95)}}
h1{font-size:clamp(30px,8.4vw,38px);line-height:1.25;margin:6px 0 22px}
h2{font-size:clamp(28px,7.6vw,34px);line-height:1.25;margin:4px 0 6px}
.sub{font-size:14px;color:var(--muted);margin:0 0 18px}
.pug{position:relative;width:136px;height:136px;margin:0 auto 14px}
.pug img{width:100%;height:100%;object-fit:cover;border-radius:38px;border:3px solid var(--ink);background:var(--pale);transform:rotate(-4deg);box-shadow:5px 5px 0 var(--pink2)}
.pug.wob img{animation:wob .45s}
@keyframes wob{25%{transform:rotate(9deg) scale(1.06)}50%{transform:rotate(-12deg)}75%{transform:rotate(6deg)}}
.bub{position:absolute;right:-18px;top:-10px;font-size:30px;background:#fff;border:2.5px solid var(--ink);border-radius:50%;width:50px;height:50px;display:grid;place-items:center;transform:rotate(8deg)}
.btn{border:3px solid var(--ink);border-radius:18px;padding:12px 26px;font-size:24px;cursor:pointer;color:var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);transition:transform .12s,box-shadow .12s;touch-action:manipulation}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.main{background:var(--pink);color:#fff;text-shadow:0 2px 0 rgba(90,15,58,.35)}
.btn.soft{background:var(--pink2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:14px;justify-content:center;align-items:center;min-height:64px}
#yes{--s:1;transform:scale(var(--s));transition:transform .3s cubic-bezier(.34,1.56,.64,1);font-size:26px;padding:12px 34px}
#yes:active{transform:scale(calc(var(--s)*.95))}
#no{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#no.fly{position:fixed;left:0;top:0;z-index:60;transition:transform .28s cubic-bezier(.34,1.56,.64,1);will-change:transform}
#tease{min-height:22px;margin:26px 0 0;font-size:14px;color:var(--muted)}
.badge{display:inline-block;font-family:'Hi Melody';font-size:17px;padding:4px 14px;border:2.5px solid var(--ink);border-radius:99px;background:var(--pink2);margin-bottom:10px}
.label{font-family:'Hi Melody';font-size:19px;text-align:left;margin:14px 0 8px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 12px;margin:0 -4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.chip{flex:0 0 auto;border:2.5px solid var(--ink);border-radius:16px;background:#fff;padding:8px 12px;min-width:66px;font-size:20px;cursor:pointer;color:var(--ink);scroll-snap-align:start;line-height:1.2}
.chip small{display:block;font-family:'Gowun Dodum';font-size:11px;color:var(--muted)}
.chip.we{background:var(--pale)}
.chip.on,.chip.hl{background:var(--pink);color:#fff;box-shadow:0 3px 0 var(--ink);transform:translateY(-2px)}
.chip.on small{color:#ffe0f0}
.grid{display:grid;gap:8px}
.times{grid-template-columns:repeat(4,1fr)}
.times .chip{min-width:0;padding:10px 2px;font-size:18px}
.foods{grid-template-columns:repeat(3,1fr);margin-bottom:12px}
.foods .chip{padding:12px 4px;font-size:19px}
.foods .chip span{display:block;font-size:30px;line-height:1.1;margin-bottom:2px}
.foods .chip.hl{transform:scale(1.07)}
.err{min-height:18px;font-size:13px;color:var(--pink);margin:6px 0}
.nav{display:flex;gap:10px;margin-top:8px}
.nav .btn{font-size:21px;padding:12px 16px}.nav .grow{flex:1}
.ticket{position:relative;border:3px dashed var(--ink);border-radius:20px;background:#fff;padding:18px 14px 14px;margin:6px 0 16px;text-align:left}
.ticket .big{font-family:'Hi Melody';font-size:clamp(28px,7.6vw,34px);line-height:1.3;text-align:center;margin:2px 0 12px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:15px;padding:8px 0;border-top:2px dotted var(--pink2)}
.kv b{font-family:'Hi Melody';font-weight:400}
.stamp{position:absolute;right:-6px;top:-18px;transform:rotate(12deg);font-family:'Hi Melody';font-size:24px;color:var(--pink);border:3px solid var(--pink);border-radius:10px;padding:2px 10px;background:#fff;animation:st .5s .3s cubic-bezier(.34,1.56,.64,1) both}
@keyframes st{from{transform:scale(3) rotate(40deg);opacity:0}}
.ps{font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.5;white-space:pre-line}
.btns{display:flex;flex-direction:column;gap:10px}.btns .btn{font-size:21px}
#modal{position:fixed;inset:0;z-index:100;background:rgba(90,15,58,.55);align-items:flex-start;justify-content:center;padding:14px;display:none;overflow:auto}
#modal.open{display:flex}
#modal .box{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:18px;width:100%;max-width:460px;margin:auto}
#modal h3{font-weight:400;font-size:26px;margin:0}
#modal .sec{font-family:'Hi Melody';color:var(--pink);margin:18px 0 4px;font-size:21px}
#modal label{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px}
#modal input,#modal textarea{width:100%;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;font:inherit;font-size:16px;background:var(--card);color:var(--ink)}
.frow{display:grid;grid-template-columns:64px 1fr;gap:8px;margin-bottom:8px}.frow input:first-child{text-align:center;font-size:22px;padding:6px}
.mbar{position:sticky;bottom:-18px;background:#fff;margin:16px -18px -18px;padding:12px 18px;border-top:2px solid var(--pale);display:flex;gap:8px;flex-wrap:wrap;border-radius:0 0 22px 22px}
.mbar .btn{font-size:15px;padding:9px 14px}
#toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:120;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.float{animation:none}}
</style>
</head>
<body>
<span class="float" style="left:6%;top:12%">💗</span><span class="float" style="right:8%;top:20%;animation-delay:-3s">✨</span>
<span class="float" style="left:10%;bottom:14%;animation-delay:-5s">🎀</span><span class="float" style="right:6%;bottom:10%;animation-delay:-2s">💖</span>

<header><button id="b-edit" type="button">✏️ 수정</button></header>

<main>
  <section id="s-ask" class="card">
    <div class="pug" id="pug"><img class="mascot" alt=""><div class="bub" id="bubble">😐</div></div>
    <h1 id="t-ask"></h1>
    <div class="row">
      <button id="yes" class="btn main" type="button"></button>
      <span id="slot"><button id="no" class="btn" type="button"></button></span>
    </div>
    <p id="tease"></p>
  </section>

  <section id="s-yes" class="card hidden">
    <div class="pug"><img class="mascot" alt="" style="animation:wob .6s infinite"><div class="bub">🥳</div></div>
    <span class="badge">수락 완료 ✓</span>
    <h2 id="t-yes"></h2>
    <p class="sub" id="t-yes2"></p>
    <button id="go-date" class="btn main" type="button"></button>
  </section>

  <section id="s-date" class="card hidden">
    <h2 id="t-date"></h2>
    <div class="label">📅 날짜</div>
    <div class="strip" id="days"></div>
    <div class="label">⏰ 시간</div>
    <div class="grid times" id="times"></div>
    <p class="err"></p>
    <button id="lock-date" class="btn main" style="width:100%" type="button" disabled>다음으로 →</button>
  </section>

  <section id="s-food" class="card hidden">
    <h2 id="t-food"></h2>
    <p class="sub" id="t-food2"></p>
    <div class="grid foods" id="foods"></div>
    <button id="roll" class="btn soft" style="width:100%;margin-bottom:12px" type="button">🎲 룰렛으로 정하기</button>
    <div class="nav">
      <button id="back" class="btn" type="button">← 이전</button>
      <button id="lock-food" class="btn main grow" type="button" disabled>확정하기</button>
    </div>
  </section>

  <section id="s-end" class="card hidden">
    <span class="badge">약속 확정 💗</span>
    <div class="ticket">
      <div class="stamp">OK!</div>
      <div class="big" id="e-main"></div>
      <div class="kv"><span>날짜</span><b id="v-date"></b></div>
      <div class="kv"><span>시간</span><b id="v-time"></b></div>
      <div class="kv"><span>메뉴</span><b id="v-menu"></b></div>
    </div>
    <p class="ps" id="e-ps"></p>
    <div class="btns">
      <button id="copy" class="btn main" type="button">약속 내용 복사</button>
      <button id="share" class="btn soft hidden" type="button">카톡/문자로 보내기</button>
      <button id="restart" class="btn" type="button">다시 고르기</button>
    </div>
  </section>
</main>

<div id="modal"><div class="box">
  <div style="display:flex;justify-content:space-between;align-items:center"><h3>✏️ 내용 수정</h3><button id="m-close" class="btn" style="padding:2px 12px;font-size:16px" type="button">✕</button></div>

  <div class="sec">첫 화면</div>
  <label for="m-ask">질문 (줄바꿈 가능)</label><textarea id="m-ask" rows="2"></textarea>
  <label for="m-yes">좋아 버튼</label><input id="m-yes">
  <label for="m-no">안 돼 버튼</label><input id="m-no">
  <label for="m-teases">도망갈 때 나오는 멘트 (한 줄에 하나씩)</label><textarea id="m-teases" rows="5"></textarea>

  <div class="sec">수락했을 때</div>
  <label for="m-yesT">제목</label><input id="m-yesT">
  <label for="m-yesS">부제</label><input id="m-yesS">

  <div class="sec">메뉴 9개 (이모지 + 이름)</div>
  <div id="m-foods"></div>
  <label for="m-times">고를 수 있는 시간 (쉼표로, 24시간제)</label><input id="m-times" placeholder="12:00, 18:00, 19:30">

  <div class="sec">마지막 화면</div>
  <label for="m-end">확정 문구 ({메뉴} 자리에 고른 메뉴가 들어가요)</label><input id="m-end">
  <label for="m-ps">P.S. 한마디</label><textarea id="m-ps" rows="2"></textarea>

  <div class="mbar">
    <button id="m-save" class="btn main" type="button">저장</button>
    <button id="m-link" class="btn soft" type="button">🔗 링크 복사</button>
    <button id="m-reset" class="btn" type="button">기본값</button>
  </div>
  <p class="sub" style="margin:12px 0 0;font-size:12px">※ 상대에게는 <b>🔗 링크 복사</b>로 만든 링크를 보내면, 수정한 내용 그대로 보여요.</p>
</div></div>
<div id="toast"></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const KEY='date_invite_cfg_v3';
const DEF={
 ask:'야 이번 주에\n밥 먹자 🍚',yes:'좋아 😆',no:'안 돼',
 teases:['어? 버튼이 왜 이래 ㅋㅋ','방금 손가락 닿을 뻔했다','퍼그가 한심하게 쳐다보는 중 😑','그거 누르려고 한 거야?','반응속도 인정','안 돼 버튼은 지금 운동 중 🏃','포기하면 편해 👈','잡으면 내가 밥 산다 (안 잡힘)','손가락 아프겠다 그만해 ㅋㅋ','야 이쯤 되면 걍 가자','퍼그 표정 봐 이미 알고 있어','제발 "좋아" 눌러줘 ㅠ'],
 yesT:'오 ㅋㅋ 진짜?!',yesS:'거절하면 어쩌나 했는데 다행이다 ㅋㅋ',go:'일정 정하기 →',
 dateT:'언제가 편해?',foodT:'뭐 먹을까?',foodS:'하나 골라줘. 못 고르겠으면 룰렛!',
 end:'{메뉴} 먹으러 가자!',ps:'P.S. 카톡으로 물어봐도 되는데 그냥 심심해서 만들어 봤어 ㅋㅋ 저 퍼그는 공식 마스코트야.',
 foods:[['🍕','피자'],['🍣','스시'],['🍔','버거'],['🍝','파스타'],['🌮','타코'],['🍜','라멘'],['🥓','삼겹살'],['🍗','치킨'],['🌶️','떡볶이']],
 times:'11:30,12:00,13:00,17:00,18:00,19:00,20:00,21:00'
};
const BUBBLES=['😐','😮','🤨','😏','🥺','😤','🤣'],NOS=['','안 돼?','진짜?','아닌데?','잠깐만','헉','도와줘','…'];
const WD=['일','월','화','수','목','금','토'];
const clone=o=>JSON.parse(JSON.stringify(o));
let CFG=clone(DEF),fromLink=false;
function merge(o){if(!o||typeof o!=='object')return;
 for(const k of Object.keys(DEF)){if(o[k]==null||o[k]==='')continue;
  if(k==='foods'){if(Array.isArray(o.foods)&&o.foods.length===9)CFG.foods=o.foods.map((f,i)=>[String(f[0]||DEF.foods[i][0]),String(f[1]||DEF.foods[i][1])])}
  else if(k==='teases'){if(Array.isArray(o.teases)&&o.teases.length)CFG.teases=o.teases.map(String)}
  else CFG[k]=String(o[k])}}
const enc=o=>{const b=new TextEncoder().encode(JSON.stringify(o));let s='';b.forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const dec=s=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))));
try{const m=location.hash.match(/^#c=(.+)$/);if(m){merge(dec(decodeURIComponent(m[1])));fromLink=true}}catch(_){}
if(!fromLink)try{merge(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(_){}
if(fromLink&&!/[?&]edit/.test(location.search))$('b-edit').classList.add('hidden');

/* 마스코트: 저장소에 올린 mascot.jpg 사용 (없으면 🐶 이모지) */
const FALL='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#ffd3ea"/><text x="50" y="68" font-size="60" text-anchor="middle">🐶</text></svg>');
document.querySelectorAll('.mascot').forEach(i=>{i.onerror=()=>{i.onerror=null;i.src=FALL};i.src='mascot.jpg'});

let tt;const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)};
const boom=o=>{if(typeof confetti==='function')confetti(Object.assign({colors:['#ff4fa3','#ff93c9','#ffe6f2','#5a0f3a','#fff'],disableForReducedMotion:true},o))};
const st={step:'ask',n:0,day:null,time:null,food:null,rolling:false};
const TIMES=()=>{const a=CFG.times.split(',').map(s=>s.trim()).filter(s=>/^\d{1,2}:\d{2}$/.test(s));return (a.length?a:DEF.times.split(',')).slice(0,12)};
const fmtT=t=>{const[h,m]=t.split(':').map(Number);return `${h<12?'오전':'오후'} ${h>12?h-12:h||12}:${String(m).padStart(2,'0')}`};
const fmtD=d=>`${d.getMonth()+1}월 ${d.getDate()}일`;

/* ---------- 도망가는 '안 돼' 버튼 ---------- */
const no=$('no'),yes=$('yes'),slot=$('slot'),pug=$('pug');
let fly=false,bx=0,by=0,last=0,px=-999,py=-999;
const vw=()=>document.documentElement.clientWidth,vh=()=>window.innerHeight;
function near(x,y,m){const r=no.getBoundingClientRect();return x>r.left-m&&x<r.right+m&&y>r.top-m&&y<r.bottom+m}
function place(x,y){bx=x;by=y;no.style.transform=`translate3d(${Math.round(x)}px,${Math.round(y)}px,0) scale(${Math.max(.72,1-st.n*.025).toFixed(2)})`}
function noLabel(){const i=Math.min(Math.floor(st.n/2),NOS.length-1);no.textContent=i?NOS[i]:CFG.no}
function dodge(e){
  if(st.step!=='ask')return;
  if(e&&e.cancelable)e.preventDefault();
  const now=Date.now();if(now-last<220)return;last=now;
  const w=no.offsetWidth,h=no.offsetHeight;
  if(!fly){
    const r=no.getBoundingClientRect();fly=true;
    document.body.appendChild(no);no.classList.add('fly');
    no.style.transition='none';place(r.left,r.top);void no.offsetWidth;no.style.transition='';
    slot.style.display='none';
  }
  const pad=12,top=64,maxX=vw()-w-pad,maxY=vh()-h-pad,yr=yes.getBoundingClientRect();
  const ccx=bx+w/2,ccy=by+h/2,minD=Math.min(170,Math.min(vw(),vh())/3);
  let best=null,far=-1,fb=null;
  for(let i=0;i<50;i++){
    const x=pad+Math.random()*Math.max(1,maxX-pad),y=top+Math.random()*Math.max(1,maxY-top);
    const cx=x+w/2,cy=y+h/2,d=Math.hypot(cx-ccx,cy-ccy);
    const hit=x<yr.right+14&&x+w>yr.left-14&&y<yr.bottom+14&&y+h>yr.top-14;
    if(!hit&&d>far){far=d;fb={x,y}}
    if(!hit&&d>minD&&Math.hypot(cx-px,cy-py)>110){best={x,y};break}
  }
  best=best||fb||{x:pad,y:top};
  place(best.x,best.y);
  st.n++;
  const T=CFG.teases;
  $('tease').textContent=T[Math.min(st.n-1,T.length-1)]+(st.n>3?`  (${st.n})`:'');
  noLabel();
  $('bubble').textContent=BUBBLES[Math.min(Math.floor(st.n/2),BUBBLES.length-1)];
  yes.style.setProperty('--s',Math.min(1+st.n*.04,1.3).toFixed(2));
  pug.classList.remove('wob');void pug.offsetWidth;pug.classList.add('wob');
  if(navigator.vibrate)try{navigator.vibrate(18)}catch(_){}
}
function resetNo(){
  st.n=0;
  if(fly){fly=false;no.classList.remove('fly');no.style.transform='';no.style.transition='';slot.style.display='';slot.appendChild(no)}
  no.hidden=false;no.textContent=CFG.no;yes.style.setProperty('--s',1);$('tease').textContent='';$('bubble').textContent='😐';
}
window.addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;if(e.pointerType==='mouse'&&st.step==='ask'&&near(e.clientX,e.clientY,36))dodge(e)},{passive:true});
document.addEventListener('pointerdown',e=>{px=e.clientX;py=e.clientY;if(st.step==='ask'&&near(e.clientX,e.clientY,e.pointerType==='mouse'?14:30)){last=0;dodge(e)}},true);
no.addEventListener('touchstart',e=>dodge(e),{passive:false});
no.addEventListener('mouseenter',dodge);
no.addEventListener('focus',()=>{last=0;dodge()});
no.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();last=0;dodge(e)});
no.addEventListener('contextmenu',e=>e.preventDefault());
const keep=()=>{if(!fly)return;const w=no.offsetWidth,h=no.offsetHeight;place(Math.min(Math.max(12,bx),Math.max(12,vw()-w-12)),Math.min(Math.max(64,by),Math.max(64,vh()-h-12)))};
window.addEventListener('resize',keep);window.addEventListener('orientationchange',()=>setTimeout(keep,250));

/* ---------- 화면 ---------- */
const P={ask:'s-ask',yes:'s-yes',date:'s-date',food:'s-food',end:'s-end'};
function show(k){
  st.step=k;Object.entries(P).forEach(([a,id])=>$(id).classList.toggle('hidden',a!==k));
  no.hidden=k!=='ask';window.scrollTo(0,0);
  if(k==='yes'){boom({particleCount:90,spread:80,origin:{x:.2,y:.7}});boom({particleCount:90,spread:80,origin:{x:.8,y:.7}})}
  if(k==='end'){renderEnd();boom({particleCount:140,spread:100,origin:{y:.55}});setTimeout(()=>boom({particleCount:80,angle:60,spread:70,origin:{x:0,y:.7}}),300);setTimeout(()=>boom({particleCount:80,angle:120,spread:70,origin:{x:1,y:.7}}),450)}
}
const dayList=()=>{const a=[],t=new Date();for(let i=0;i<14;i++)a.push(new Date(t.getFullYear(),t.getMonth(),t.getDate()+i));return a};
const same=(a,b)=>a&&b&&a.getTime()===b.getTime();
function renderDays(){
  const box=$('days');box.innerHTML='';
  dayList().forEach((d,i)=>{const b=document.createElement('button');b.type='button';
    b.className='chip'+(d.getDay()%6===0?' we':'')+(same(st.day,d)?' on':'');
    b.innerHTML=`${i===0?'오늘':i===1?'내일':fmtD(d)}<small>${WD[d.getDay()]}요일</small>`;
    b.onclick=()=>{st.day=d;renderDays();checkDate()};box.appendChild(b)});
}
function renderTimes(){
  const box=$('times');box.innerHTML='';
  TIMES().forEach(t=>{const b=document.createElement('button');b.type='button';b.className='chip'+(st.time===t?' on':'');
    b.textContent=fmtT(t);b.onclick=()=>{st.time=t;renderTimes();checkDate()};box.appendChild(b)});
}
const checkDate=()=>{$('lock-date').disabled=!(st.day&&st.time)};
function renderFoods(hl){
  const box=$('foods');box.innerHTML='';
  CFG.foods.forEach((f,i)=>{const b=document.createElement('button');b.type='button';
    b.className='chip'+(st.food===i&&hl==null?' on':'')+(hl===i?' hl':'');
    const s=document.createElement('span');s.textContent=f[0];b.appendChild(s);b.appendChild(document.createTextNode(f[1]));
    b.onclick=()=>{if(st.rolling)return;st.food=i;renderFoods()};box.appendChild(b)});
  $('lock-food').disabled=st.food===null||st.rolling;
}
function roll(){
  if(st.rolling)return;st.rolling=true;$('roll').disabled=true;
  const target=Math.floor(Math.random()*9);let i=Math.floor(Math.random()*9),steps=18+Math.floor(Math.random()*9),delay=60;
  const tick=()=>{renderFoods(i%9);if(steps-- >0||i%9!==target){i++;delay+=9;setTimeout(tick,delay)}else{st.rolling=false;st.food=target;$('roll').disabled=false;renderFoods();boom({particleCount:50,spread:60,origin:{y:.6}})}};
  tick();
}
const food=()=>CFG.foods[st.food??0];
function renderEnd(){
  const f=food();
  $('e-main').textContent=CFG.end.replace('{메뉴}',`${f[0]} ${f[1]}`);
  $('v-date').textContent=`${fmtD(st.day)} (${WD[st.day.getDay()]})`;$('v-time').textContent=fmtT(st.time);$('v-menu').textContent=`${f[0]} ${f[1]}`;
  $('e-ps').textContent=CFG.ps;
}
const planText=()=>`[약속 확정]\n날짜: ${fmtD(st.day)} (${WD[st.day.getDay()]})\n시간: ${fmtT(st.time)}\n메뉴: ${food()[0]} ${food()[1]}`;
function texts(){
  document.title=CFG.ask.replace(/\n/g,' ');
  const t=$('t-ask');t.textContent='';CFG.ask.split('\n').forEach((l,i)=>{if(i)t.appendChild(document.createElement('br'));t.appendChild(document.createTextNode(l))});
  yes.textContent=CFG.yes;if(!st.n)no.textContent=CFG.no;
  $('t-yes').textContent=CFG.yesT;$('t-yes2').textContent=CFG.yesS;$('go-date').textContent=CFG.go;
  $('t-date').textContent=CFG.dateT;$('t-food').textContent=CFG.foodT;$('t-food2').textContent=CFG.foodS;
  renderDays();renderTimes();renderFoods();if(st.step==='end')renderEnd();
}

/* ---------- 이벤트 ---------- */
yes.onclick=()=>show('yes');
$('go-date').onclick=()=>show('date');
$('lock-date').onclick=()=>show('food');
$('back').onclick=()=>{if(!st.rolling)show('date')};
$('lock-food').onclick=()=>{if(st.food!==null&&!st.rolling)show('end')};
$('roll').onclick=roll;
$('copy').onclick=()=>{const t=planText(),ok=()=>toast('복사됐어! 붙여넣어서 보내면 돼 📋');
  const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove();ok()};
  navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(ok).catch(fb):fb()};
if(navigator.share)$('share').classList.remove('hidden');
$('share').onclick=()=>{navigator.share({text:planText()}).catch(()=>{})};
$('restart').onclick=()=>{st.day=null;st.time=null;st.food=null;checkDate();resetNo();texts();show('ask')};

/* ---------- 수정 화면 ---------- */
function fillModal(){
  $('m-ask').value=CFG.ask;$('m-yes').value=CFG.yes;$('m-no').value=CFG.no;$('m-teases').value=CFG.teases.join('\n');
  $('m-yesT').value=CFG.yesT;$('m-yesS').value=CFG.yesS;$('m-times').value=CFG.times;$('m-end').value=CFG.end;$('m-ps').value=CFG.ps;
  const box=$('m-foods');box.innerHTML='';
  CFG.foods.forEach(f=>{const r=document.createElement('div');r.className='frow';
    r.innerHTML='<input maxlength="4" aria-label="이모지"><input maxlength="12" aria-label="메뉴 이름">';
    r.children[0].value=f[0];r.children[1].value=f[1];box.appendChild(r)});
}
function readModal(){
  const v=id=>$(id).value.trim();
  return{ask:$('m-ask').value.trim(),yes:v('m-yes'),no:v('m-no'),teases:$('m-teases').value.split('\n').map(s=>s.trim()).filter(Boolean),
   yesT:v('m-yesT'),yesS:v('m-yesS'),times:v('m-times'),end:v('m-end'),ps:$('m-ps').value.trim(),
   foods:[...$('m-foods').children].map(r=>[r.children[0].value.trim(),r.children[1].value.trim()])};
}
function apply(o){CFG=clone(DEF);merge(o);resetNo();texts()}
const openM=()=>{fillModal();$('modal').classList.add('open')},closeM=()=>$('modal').classList.remove('open');
$('b-edit').onclick=openM;$('m-close').onclick=closeM;
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeM()});
$('m-save').onclick=()=>{const o=readModal();apply(o);try{localStorage.setItem(KEY,JSON.stringify(CFG))}catch(_){}closeM();toast('저장됐어! 🔗 링크 복사로 상대에게 보내요')};
$('m-link').onclick=()=>{const o=readModal();apply(o);try{localStorage.setItem(KEY,JSON.stringify(CFG))}catch(_){}
  const url=location.origin==='null'||location.protocol==='file:'?location.href.split('#')[0]+'#c='+encodeURIComponent(enc(CFG)):location.origin+location.pathname+'#c='+encodeURIComponent(enc(CFG));
  const ok=()=>toast('링크 복사 완료! 이걸 보내면 수정한 내용이 보여요 💌');
  const fb=()=>{const a=document.createElement('textarea');a.value=url;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove();ok()};
  navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(url).then(ok).catch(fb):fb()};
$('m-reset').onclick=()=>{try{localStorage.removeItem(KEY)}catch(_){}apply(null);fillModal();toast('기본값으로 돌렸어')};
texts();
})();
</script>
</body>
</html>
